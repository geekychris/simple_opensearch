apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opensearch-data
  namespace: default
  labels:
    app: opensearch
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi
  storageClassName: standard  # Adjust based on your cloud provider or storage system

---
# If you're using a local Kubernetes cluster (like Minikube) and need a PV:
# This is optional and cloud providers usually have dynamic provisioning
apiVersion: v1
kind: PersistentVolume
metadata:
  name: opensearch-data-pv
  labels:
    type: local
    app: opensearch
spec:
  storageClassName: standard
  capacity:
    storage: 30Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/mnt/data/opensearch"

